name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Format, Receipts & DAG Boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vm/tools/common/format/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vm/package-lock.json

      - name: Install pinned formatting tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r vm/tools/common/format/requirements.txt
          python vm/tools/common/format/install_powershell.py
          npm --prefix vm ci --ignore-scripts --no-audit --no-fund

      - name: Check formatting and source receipts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix vm run format:check

      - name: Run boundary, layout, ABI & CI helper checks
        shell: bash
        run: |
          set -euo pipefail
          python -B vm/tests/common/test_format_contract.py
          python -B vm/tests/common/test_arch_boundaries.py
          python -B vm/tests/common/validate_layout.py --require-native
          python -B vm/tests/common/test_property_ic_generator.py
          python -B vm/tests/common/test_c_source_match.py
          python -B vm/tests/common/test_target_runner.py
          python -B vm/tests/x86/common/test_vm_abi.py
          python -B vm/tests/x86/win64/test_vm_private.py
          python -B vm/tests/x86/win64/test_vm_core_routes.py
          python -B vm/tests/arm64/test_publication_directive.py
          python -B vm/tests/x86/linux/test_elf_machine_x86.py
          python -B vm/tests/arm64/test_elf_machine_arm64.py
          python -B vm/ci/test_ci_helpers.py

  linux-x86_64:
    name: Linux x86-64 (LINUX_X86_64 + SDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 binutils cmake ninja-build python3

      - name: Build, CTest & install LINUX_X86_64
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc-13 CXX=g++-13 QJS_BUILD_JOBS=4 \
            bash vm/tools/x86/linux/build/product-linux.sh build/linux-native out/sdk-linux-native
          python3 -c 'import json; d = json.load(open("build/linux-native/interpreter-backend.json", encoding="utf-8")); assert d["effective"] == "LINUX_X86_64", d; print("Verified effective backend:", d["effective"])'

      - name: Verify C & C++11 SDK consumer
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc-13 CXX=g++-13 cmake -S vm/tests/common/consumer -B build/consumer-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/out/sdk-linux-native"
          cmake --build build/consumer-linux --parallel 4
          ctest --test-dir build/consumer-linux --output-on-failure

      - name: Verify QJS_BUILD_CLI=OFF static embedding & build contracts
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc-13 cmake -S vm -B build/linux-libonly -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQJS_FRAME_BACKEND=LINUX_X86_64 \
            -DQJS_FRAME_BUILD_TESTS=OFF \
            -DQJS_BUILD_CLI=OFF \
            -DQJS_BACKPORT_CONTEXT_OOM=ON \
            -DQJS_FRAME_EXPERIMENTAL_ALLOCATOR=ON \
            -DQJS_DEFAULT_EXPERIMENT_ALLOCATOR=256 \
            -DQJS_FRAME_EXPERIMENTAL_COMPARE=ON \
            -DQJS_BACKPORT_COMPUTED_ASSIGN=ON \
            -DQJS_BACKPORT_VALUE64_INIT=ON \
            -DQJS_BACKPORT_MIXED_NUMBERS=ON \
            -DQJS_BACKPORT_MAP_POINTER_HASH=ON \
            -DQJS_PROPERTY_IC=ON \
            -DQJS_BACKPORT_PORTABLE_REGEXP=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/out/sdk-linux-libonly"
          cmake --build build/linux-libonly --parallel 4
          cmake --install build/linux-libonly
          test ! -e out/sdk-linux-libonly/bin/qjs
          test -f out/sdk-linux-libonly/lib/libqjs.a
          CC=gcc-13 CXX=g++-13 cmake -S vm/tests/common/consumer -B build/consumer-libonly -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/out/sdk-linux-libonly"
          cmake --build build/consumer-libonly --parallel 4
          ctest --test-dir build/consumer-libonly --output-on-failure
          python3 -B vm/tests/x86/win64/test_vm_build.py --cmake cmake

  linux-arm64:
    name: Linux ARM64 (LINUX_AARCH64 + PORTABLE)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 binutils cmake ninja-build python3

      - name: Build, CTest & install LINUX_AARCH64
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc-13 CXX=g++-13 QJS_BUILD_JOBS=4 \
            bash vm/tools/arm64/build/product-linux-aarch64.sh build/arm64-native out/sdk-arm64-native
          python3 -c 'import json; d = json.load(open("build/arm64-native/interpreter-backend.json", encoding="utf-8")); assert d["effective"] == "LINUX_AARCH64", d; print("Verified effective backend:", d["effective"])'

      - name: Verify ARM64 C & C++11 SDK consumer
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc-13 CXX=g++-13 cmake -S vm/tests/common/consumer -B build/consumer-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/out/sdk-arm64-native"
          cmake --build build/consumer-arm64 --parallel 4
          ctest --test-dir build/consumer-arm64 --output-on-failure

      - name: Build, CTest & verify PORTABLE + ABI checks
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc-13 CXX=g++-13 QJS_BUILD_JOBS=4 \
            bash vm/tools/arm64/build/product-linux-aarch64-portable.sh \
              build/arm64-portable out/sdk-arm64-portable

  windows-x86_64:
    name: Windows x86-64 (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: msvc-md
            label: MSVC /MD
            toolchain: msvc
            runtime: MD
          - slug: msvc-mt
            label: MSVC /MT
            toolchain: msvc
            runtime: MT
          - slug: mingw
            label: MinGW UCRT64
            toolchain: mingw
            runtime: ""
    steps:
      - name: Configure Git LF endings before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "Failed to configure core.autocrlf" }

      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p

      - name: Locate MSYS2 UCRT64 tools
        id: tools
        shell: msys2 {0}
        run: |
          echo "cmake=$(cygpath -am "$(command -v cmake)")" >> "$GITHUB_OUTPUT"
          echo "ninja=$(cygpath -am "$(command -v ninja)")" >> "$GITHUB_OUTPUT"
          echo "gcc=$(cygpath -am "$(command -v gcc)")" >> "$GITHUB_OUTPUT"
          echo "gxx=$(cygpath -am "$(command -v g++)")" >> "$GITHUB_OUTPUT"
          echo "objdump=$(cygpath -am "$(command -v objdump)")" >> "$GITHUB_OUTPUT"
          echo "as=$(cygpath -am "$(command -v as)")" >> "$GITHUB_OUTPUT"
          echo "ucrt_bin=$(cygpath -aw /ucrt64/bin)" >> "$GITHUB_OUTPUT"

      - name: Build, CTest & verify WIN64 native backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.toolchain }}' -eq 'mingw') {
            $env:Path = "${{ steps.tools.outputs.ucrt_bin }};$env:Path"
          }
          python -B vm/tests/common/validate_layout.py --require-native
          if ($LASTEXITCODE -ne 0) { throw "validate_layout.py failed" }

          $buildDir = "build/${{ matrix.slug }}"
          $buildArgs = @{
            Toolchain = '${{ matrix.toolchain }}'
            Backend   = 'WIN64'
            BuildPath = $buildDir
            CMake     = '${{ steps.tools.outputs.cmake }}'
            Ninja     = '${{ steps.tools.outputs.ninja }}'
            Objdump   = '${{ steps.tools.outputs.objdump }}'
            Assembler = '${{ steps.tools.outputs.as }}'
            Jobs      = 4
            Test      = $true
          }
          if ('${{ matrix.toolchain }}' -eq 'msvc') {
            $buildArgs.MsvcRuntime = '${{ matrix.runtime }}'
            if ('${{ matrix.runtime }}' -eq 'MT') {
              $buildArgs.DefaultExperimentAllocator = '256'
            }
          } else {
            $buildArgs.Compiler = '${{ steps.tools.outputs.gcc }}'
          }
          ./vm/tools/x86/win64/build/build-baseline.ps1 @buildArgs

          $backend = Get-Content "$buildDir/interpreter-backend.json" -Raw | ConvertFrom-Json
          if ($backend.effective -ne 'WIN64') {
            throw "Expected effective backend WIN64, got $($backend.effective)"
          }
          & '${{ steps.tools.outputs.cmake }}' --build $buildDir --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Unchanged native rebuild failed" }

      - name: Verify SDK consumer, CRT purity & fallback contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = '${{ steps.tools.outputs.cmake }}'
          $ninja = '${{ steps.tools.outputs.ninja }}'
          $ctest = Join-Path (Split-Path -Parent $cmake) 'ctest.exe'
          $buildDir = "build/${{ matrix.slug }}"
          $sdkDir = "$PWD/out/sdk-${{ matrix.slug }}"

          & $cmake --install $buildDir --prefix $sdkDir
          if ($LASTEXITCODE -ne 0) { throw "cmake --install failed" }

          if ('${{ matrix.toolchain }}' -eq 'msvc') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
            if (-not $vsPath) { throw "Visual Studio installation not found" }
            & (Join-Path $vsPath 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

            $rt = if ('${{ matrix.runtime }}' -eq 'MT') { 'MultiThreaded' } else { 'MultiThreadedDLL' }
            $consumerDir = "build/consumer-${{ matrix.slug }}"
            & $cmake -S vm/tests/common/consumer -B $consumerDir -G Ninja `
              "-DCMAKE_MAKE_PROGRAM=$ninja" `
              -DCMAKE_BUILD_TYPE=Release `
              "-DCMAKE_MSVC_RUNTIME_LIBRARY=$rt" `
              "-DCMAKE_PREFIX_PATH=$sdkDir"
            if ($LASTEXITCODE -ne 0) { throw "MSVC consumer configure failed" }
            & $cmake --build $consumerDir --parallel 4
            if ($LASTEXITCODE -ne 0) { throw "MSVC consumer build failed" }
            & $ctest --test-dir $consumerDir --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "MSVC consumer CTest failed" }

            if ('${{ matrix.runtime }}' -eq 'MT') {
              python -B vm/ci/verify_pe_imports.py --allow KERNEL32.dll "$buildDir/qjs.exe" "$buildDir/qjsc.exe"
              if ($LASTEXITCODE -ne 0) { throw "Static CRT PE import verification failed" }

              $libSdk = "$PWD/out/sdk-msvc-mt-libonly"
              & $cmake -S vm -B build/msvc-mt-libonly -G Ninja `
                "-DCMAKE_MAKE_PROGRAM=$ninja" `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
                -DQJS_FRAME_BACKEND=WIN64 `
                "-DQJS_FRAME_OBJDUMP=${{ steps.tools.outputs.objdump }}" `
                "-DQJS_FRAME_AS=${{ steps.tools.outputs.as }}" `
                -DQJS_BACKPORT_CONTEXT_OOM=ON `
                -DQJS_FRAME_EXPERIMENTAL_ALLOCATOR=ON `
                -DQJS_DEFAULT_EXPERIMENT_ALLOCATOR=256 `
                -DQJS_FRAME_EXPERIMENTAL_COMPARE=ON `
                -DQJS_BACKPORT_COMPUTED_ASSIGN=ON `
                -DQJS_BACKPORT_VALUE64_INIT=ON `
                -DQJS_BACKPORT_MIXED_NUMBERS=ON `
                -DQJS_BACKPORT_MAP_POINTER_HASH=ON `
                -DQJS_PROPERTY_IC=ON `
                -DQJS_BACKPORT_PORTABLE_REGEXP=ON `
                -DQJS_BUILD_CLI=OFF `
                "-DCMAKE_INSTALL_PREFIX=$libSdk"
              if ($LASTEXITCODE -ne 0) { throw "MSVC /MT libonly configure failed" }
              & $cmake --build build/msvc-mt-libonly --parallel 4
              if ($LASTEXITCODE -ne 0) { throw "MSVC /MT libonly build failed" }
              & $cmake --install build/msvc-mt-libonly
              if ($LASTEXITCODE -ne 0) { throw "MSVC /MT libonly install failed" }
              if (Test-Path "$libSdk/bin/qjs.exe") { throw "QJS_BUILD_CLI=OFF unexpectedly installed qjs.exe" }
              if (-not (Test-Path "$libSdk/lib/qjs.lib")) { throw "QJS_BUILD_CLI=OFF did not install qjs.lib" }
            }
          } else {
            $env:Path = "${{ steps.tools.outputs.ucrt_bin }};$env:Path"
            & $cmake -S vm/tests/common/consumer -B build/consumer-mingw -G Ninja `
              "-DCMAKE_C_COMPILER=${{ steps.tools.outputs.gcc }}" `
              "-DCMAKE_CXX_COMPILER=${{ steps.tools.outputs.gxx }}" `
              "-DCMAKE_MAKE_PROGRAM=$ninja" `
              -DCMAKE_BUILD_TYPE=Release `
              "-DCMAKE_PREFIX_PATH=$sdkDir"
            if ($LASTEXITCODE -ne 0) { throw "MinGW consumer configure failed" }
            & $cmake --build build/consumer-mingw --parallel 4
            if ($LASTEXITCODE -ne 0) { throw "MinGW consumer build failed" }
            & $ctest --test-dir build/consumer-mingw --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "MinGW consumer CTest failed" }

            ./vm/tools/x86/win64/build/build-interpreter.ps1 `
              -Toolchain mingw `
              -Backend AUTO `
              -Shared `
              -BuildPath build/mingw-shared `
              -CMake $cmake `
              -Ninja $ninja `
              -Compiler '${{ steps.tools.outputs.gcc }}' `
              -Jobs 4 `
              -Test
            $sharedBackend = Get-Content build/mingw-shared/interpreter-backend.json -Raw | ConvertFrom-Json
            if ($sharedBackend.effective -ne 'PORTABLE') {
              throw "Shared AUTO did not select PORTABLE fallback"
            }

            python -B vm/tests/x86/win64/test_vm_build.py --cmake $cmake
            if ($LASTEXITCODE -ne 0) { throw "test_vm_build.py failed" }
          }

  portable-sanitizers:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux ASan+UBSan
            os: ubuntu-24.04
            mode: asan-ubsan
          - label: macOS AUTO Portable
            os: macos-latest
            mode: macos
    steps:
      - uses: actions/checkout@v7

      - name: Build & CTest Linux ASan+UBSan
        if: matrix.mode == 'asan-ubsan'
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:allocator_may_return_null=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm cmake ninja-build python3
          cmake -S vm -B build/asan -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQJS_FRAME_BACKEND=AUTO \
            -DQJS_FRAME_BUILD_TESTS=ON \
            -DQJS_ENABLE_ASAN=ON \
            -DQJS_ENABLE_UBSAN=ON \
            -DQJS_BACKPORT_CONTEXT_OOM=ON \
            -DQJS_FRAME_EXPERIMENTAL_ALLOCATOR=ON \
            -DQJS_FRAME_EXPERIMENTAL_COMPARE=ON \
            -DQJS_BACKPORT_COMPUTED_ASSIGN=ON \
            -DQJS_BACKPORT_VALUE64_INIT=ON \
            -DQJS_BACKPORT_MIXED_NUMBERS=ON \
            -DQJS_BACKPORT_MAP_POINTER_HASH=ON \
            -DQJS_PROPERTY_IC=ON \
            -DQJS_BACKPORT_PORTABLE_REGEXP=ON
          python3 -c 'import json; d = json.load(open("build/asan/interpreter-backend.json", encoding="utf-8")); assert d["effective"] == "PORTABLE", d; print("Verified effective backend:", d["effective"])'
          cmake --build build/asan --parallel 4
          ctest --test-dir build/asan --output-on-failure --parallel 4

      - name: Build, CTest & Consumer macOS AUTO Portable
        if: matrix.mode == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          cmake -S vm -B build/macos-portable -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQJS_FRAME_BACKEND=AUTO \
            -DQJS_FRAME_BUILD_TESTS=ON \
            -DQJS_BACKPORT_CONTEXT_OOM=ON \
            -DQJS_FRAME_EXPERIMENTAL_ALLOCATOR=ON \
            -DQJS_FRAME_EXPERIMENTAL_COMPARE=ON \
            -DQJS_BACKPORT_COMPUTED_ASSIGN=ON \
            -DQJS_BACKPORT_VALUE64_INIT=ON \
            -DQJS_BACKPORT_MIXED_NUMBERS=ON \
            -DQJS_BACKPORT_MAP_POINTER_HASH=ON \
            -DQJS_PROPERTY_IC=ON \
            -DQJS_BACKPORT_PORTABLE_REGEXP=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/out/sdk-macos"
          python3 -c 'import json; d = json.load(open("build/macos-portable/interpreter-backend.json", encoding="utf-8")); assert d["effective"] == "PORTABLE", d; print("Verified effective backend:", d["effective"])'
          cmake --build build/macos-portable --parallel 4
          ctest --test-dir build/macos-portable --output-on-failure --parallel 4
          cmake --install build/macos-portable
          cmake -S vm/tests/common/consumer -B build/consumer-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/out/sdk-macos"
          cmake --build build/consumer-macos --parallel 4
          ctest --test-dir build/consumer-macos --output-on-failure
