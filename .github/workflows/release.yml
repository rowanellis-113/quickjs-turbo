name: Release

on:
  push:
    tags:
      - "v*-turbo.*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create tag & publish GitHub Release from vm/VERSION on main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  meta:
    name: Resolve & Validate Release Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
      upstream_revision: ${{ steps.resolve.outputs.upstream_revision }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version & enforce QuickJS-NG pin
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python3 -B vm/ci/release_version.py \
              --tag "${GITHUB_REF}" \
              --github-output "$GITHUB_OUTPUT"
          else
            if [[ "${{ inputs.publish_release }}" == "true" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Refusing publish_release from non-main ref: ${GITHUB_REF}" >&2
              exit 1
            fi
            python3 -B vm/ci/release_version.py \
              --github-output "$GITHUB_OUTPUT"
          fi

  linux-x86_64:
    name: SDK Linux x86-64
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 binutils cmake ninja-build python3

      - name: Build, CTest & install SDK
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          SDK_NAME="quickjs-turbo-${TAG}-linux-x86_64-sdk"
          CC=gcc-13 CXX=g++-13 QJS_BUILD_JOBS=4 \
            bash vm/tools/x86/linux/build/product-linux.sh \
              build/linux-x86_64 \
              "dist/${SDK_NAME}"
          CC=gcc-13 CXX=g++-13 cmake -S vm/tests/common/consumer -B build/consumer-linux-x86_64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/dist/${SDK_NAME}"
          cmake --build build/consumer-linux-x86_64 --parallel 4
          ctest --test-dir build/consumer-linux-x86_64 --output-on-failure
          python3 -B vm/tools/common/export-pregen.py \
            --source vm \
            --build build/linux-x86_64 \
            --output "dist/${SDK_NAME}/share/quickjs-turbo/pregen"
          python3 -B vm/ci/release_version.py \
            --write-sdk-metadata "dist/${SDK_NAME}" \
            --platform linux-x86_64 \
            --git-sha "${{ github.sha }}"
          tar -C dist -czf "${SDK_NAME}.tar.gz" "${SDK_NAME}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-linux-x86_64
          path: quickjs-turbo-*-linux-x86_64-sdk.tar.gz

  linux-aarch64:
    name: SDK Linux ARM64
    needs: meta
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 binutils cmake ninja-build python3

      - name: Build, CTest & install SDK
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          SDK_NAME="quickjs-turbo-${TAG}-linux-aarch64-sdk"
          CC=gcc-13 CXX=g++-13 QJS_BUILD_JOBS=4 \
            bash vm/tools/arm64/build/product-linux-aarch64.sh \
              build/linux-aarch64 \
              "dist/${SDK_NAME}"
          CC=gcc-13 CXX=g++-13 cmake -S vm/tests/common/consumer -B build/consumer-linux-aarch64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/dist/${SDK_NAME}"
          cmake --build build/consumer-linux-aarch64 --parallel 4
          ctest --test-dir build/consumer-linux-aarch64 --output-on-failure
          python3 -B vm/tools/common/export-pregen.py \
            --source vm \
            --build build/linux-aarch64 \
            --output "dist/${SDK_NAME}/share/quickjs-turbo/pregen"
          python3 -B vm/ci/release_version.py \
            --write-sdk-metadata "dist/${SDK_NAME}" \
            --platform linux-aarch64 \
            --git-sha "${{ github.sha }}"
          tar -C dist -czf "${SDK_NAME}.tar.gz" "${SDK_NAME}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-linux-aarch64
          path: quickjs-turbo-*-linux-aarch64-sdk.tar.gz

  windows-x86_64:
    name: SDK Windows x86-64 (${{ matrix.slug }})
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: msvc-md
            toolchain: msvc
            runtime: MD
          - slug: msvc-mt
            toolchain: msvc
            runtime: MT
          - slug: mingw
            toolchain: mingw
            runtime: ""
    steps:
      - name: Configure Git LF endings before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "Failed to configure core.autocrlf" }

      - uses: actions/checkout@v7

      - name: Install pinned Win64 MinGW GCC 13.1.0 & COFF binutils
        id: tools
        shell: pwsh
        run: |
          python -B vm/ci/install_win64_mingw.py --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Win64 MinGW toolchain" }

      - name: Build, CTest & package SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = '${{ steps.tools.outputs.cmake }}'
          $ninja = '${{ steps.tools.outputs.ninja }}'
          $ctest = Join-Path (Split-Path -Parent $cmake) 'ctest.exe'
          if ('${{ matrix.toolchain }}' -eq 'mingw') {
            $env:Path = "${{ steps.tools.outputs.mingw_bin }};$env:Path"
          }

          $tag = '${{ needs.meta.outputs.tag }}'
          $buildDir = "build/${{ matrix.slug }}"
          $sdkName = "quickjs-turbo-$tag-windows-x86_64-${{ matrix.slug }}-sdk"
          $sdkDir = "$PWD/dist/$sdkName"

          $cmakeArgs = @(
            '-S', 'vm',
            '-B', $buildDir,
            '-G', 'Ninja',
            "-DCMAKE_MAKE_PROGRAM=$ninja",
            '-DCMAKE_BUILD_TYPE=Release',
            '-DQJS_FRAME_BACKEND=WIN_X86_64',
            '-DQJS_PROPERTY_IC=ON',
            '-DQJS_FRAME_BUILD_TESTS=ON'
          )
          if ('${{ matrix.toolchain }}' -eq 'msvc') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
            if (-not $vsPath) { throw "Visual Studio installation not found" }
            & (Join-Path $vsPath 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

            $rt = if ('${{ matrix.runtime }}' -eq 'MT') { 'MultiThreaded' } else { 'MultiThreadedDLL' }
            $cmakeArgs += "-DCMAKE_MSVC_RUNTIME_LIBRARY=$rt"
          } else {
            $cmakeArgs += "-DCMAKE_C_COMPILER=${{ steps.tools.outputs.gcc }}"
          }
          & $cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "WIN_X86_64 configure failed" }
          & $cmake --build $buildDir --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "WIN_X86_64 build failed" }
          & $ctest --test-dir $buildDir --no-tests=error --output-on-failure --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "WIN_X86_64 CTest failed" }

          & $cmake --install $buildDir --prefix $sdkDir
          if ($LASTEXITCODE -ne 0) { throw "cmake --install failed" }

          if ('${{ matrix.toolchain }}' -eq 'msvc') {
            $rt = if ('${{ matrix.runtime }}' -eq 'MT') { 'MultiThreaded' } else { 'MultiThreadedDLL' }
            $consumerDir = "build/consumer-${{ matrix.slug }}"
            & $cmake -S vm/tests/common/consumer -B $consumerDir -G Ninja `
              "-DCMAKE_MAKE_PROGRAM=$ninja" `
              -DCMAKE_BUILD_TYPE=Release `
              "-DCMAKE_MSVC_RUNTIME_LIBRARY=$rt" `
              "-DCMAKE_PREFIX_PATH=$sdkDir"
            if ($LASTEXITCODE -ne 0) { throw "MSVC consumer configure failed" }
            & $cmake --build $consumerDir --parallel 4
            if ($LASTEXITCODE -ne 0) { throw "MSVC consumer build failed" }
            & $ctest --test-dir $consumerDir --no-tests=error --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "MSVC consumer CTest failed" }

            if ('${{ matrix.runtime }}' -eq 'MT') {
              python -B vm/ci/verify_pe_imports.py --allow KERNEL32.dll "$sdkDir/bin/qjs.exe" "$sdkDir/bin/qjsc.exe"
              if ($LASTEXITCODE -ne 0) { throw "Static CRT PE import verification failed" }
            }
          } else {
            & $cmake -S vm/tests/common/consumer -B build/consumer-mingw -G Ninja `
              "-DCMAKE_C_COMPILER=${{ steps.tools.outputs.gcc }}" `
              "-DCMAKE_CXX_COMPILER=${{ steps.tools.outputs.gxx }}" `
              "-DCMAKE_MAKE_PROGRAM=$ninja" `
              -DCMAKE_BUILD_TYPE=Release `
              "-DCMAKE_PREFIX_PATH=$sdkDir"
            if ($LASTEXITCODE -ne 0) { throw "MinGW consumer configure failed" }
            & $cmake --build build/consumer-mingw --parallel 4
            if ($LASTEXITCODE -ne 0) { throw "MinGW consumer build failed" }
            & $ctest --test-dir build/consumer-mingw --no-tests=error --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "MinGW consumer CTest failed" }
          }

          python -B vm/tools/common/export-pregen.py `
            --source vm `
            --build $buildDir `
            --output "$sdkDir/share/quickjs-turbo/pregen"
          if ($LASTEXITCODE -ne 0) { throw "Pregen export failed for WIN_X86_64" }

          python -B vm/ci/release_version.py `
            --write-sdk-metadata $sdkDir `
            --platform "windows-x86_64-${{ matrix.slug }}" `
            --git-sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Failed to write SDK version metadata" }

          Compress-Archive -Path $sdkDir -DestinationPath "$sdkName.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-windows-${{ matrix.slug }}
          path: quickjs-turbo-*-windows-x86_64-${{ matrix.slug }}-sdk.zip

  macos-arm64:
    name: SDK macOS ARM64 (PORTABLE)
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build, CTest & package SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          TAG="${{ needs.meta.outputs.tag }}"
          SDK_NAME="quickjs-turbo-${TAG}-macos-arm64-portable-sdk"
          cmake -S vm -B build/macos-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQJS_FRAME_BACKEND=PORTABLE \
            -DQJS_FRAME_BUILD_TESTS=ON \
            -DQJS_BACKPORT_CONTEXT_OOM=ON \
            -DQJS_FRAME_EXPERIMENTAL_COMPARE=ON \
            -DQJS_BACKPORT_COMPUTED_ASSIGN=ON \
            -DQJS_BACKPORT_VALUE64_INIT=ON \
            -DQJS_BACKPORT_MIXED_NUMBERS=ON \
            -DQJS_BACKPORT_MAP_POINTER_HASH=ON \
            -DQJS_PROPERTY_IC=ON \
            -DQJS_BACKPORT_PORTABLE_REGEXP=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/${SDK_NAME}"
          cmake --build build/macos-arm64 --parallel 4
          ctest --test-dir build/macos-arm64 --output-on-failure --parallel 4
          cmake --install build/macos-arm64
          cmake -S vm/tests/common/consumer -B build/consumer-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/dist/${SDK_NAME}"
          cmake --build build/consumer-macos --parallel 4
          ctest --test-dir build/consumer-macos --output-on-failure
          python3 -B vm/ci/release_version.py \
            --write-sdk-metadata "dist/${SDK_NAME}" \
            --platform macos-arm64-portable \
            --git-sha "${{ github.sha }}"
          tar -C dist -czf "${SDK_NAME}.tar.gz" "${SDK_NAME}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-macos-arm64
          path: quickjs-turbo-*-macos-arm64-portable-sdk.tar.gz

  macos-x86_64:
    name: SDK macOS x86-64 (MACOS_X86_64)
    needs: meta
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Build, CTest & package SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          TAG="${{ needs.meta.outputs.tag }}"
          SDK_NAME="quickjs-turbo-${TAG}-macos-x86_64-sdk"
          QJS_BUILD_JOBS=4 \
            bash vm/tools/x86/macos/build/product-macos.sh \
              build/macos-x86_64 \
              "dist/${SDK_NAME}"
          cmake -S vm/tests/common/consumer -B build/consumer-macos-x86_64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/dist/${SDK_NAME}"
          cmake --build build/consumer-macos-x86_64 --parallel 4
          ctest --test-dir build/consumer-macos-x86_64 --output-on-failure
          python3 -B vm/tools/common/export-pregen.py \
            --source vm \
            --build build/macos-x86_64 \
            --output "dist/${SDK_NAME}/share/quickjs-turbo/pregen"
          python3 -B vm/ci/release_version.py \
            --write-sdk-metadata "dist/${SDK_NAME}" \
            --platform macos-x86_64 \
            --git-sha "${{ github.sha }}"
          tar -C dist -czf "${SDK_NAME}.tar.gz" "${SDK_NAME}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-macos-x86_64
          path: quickjs-turbo-*-macos-x86_64-sdk.tar.gz

  publish:
    name: Generate SHA256SUMS & Publish Release
    needs:
      - meta
      - linux-x86_64
      - linux-aarch64
      - windows-x86_64
      - macos-arm64
      - macos-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download SDK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.tar.gz *.zip | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-sha256sums
          path: release-assets/SHA256SUMS.txt

      - name: Generate structured release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B vm/ci/release_version.py \
            --write-release-notes release-notes.md \
            --git-sha "${{ github.sha }}"
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          UPSTREAM="${{ needs.meta.outputs.upstream_version }}"
          PRERELEASE="${{ needs.meta.outputs.prerelease }}"
          TITLE="QuickJS-Turbo ${TAG} (QuickJS-NG ${UPSTREAM})"
          NOTES_HEADER="$(cat release-notes.md)"
          if [[ "${PRERELEASE}" == "true" ]]; then
            MODE_FLAGS=(--prerelease --latest=false)
          else
            MODE_FLAGS=(--latest)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            gh release create "${TAG}" release-assets/* \
              --target "${{ github.sha }}" \
              --title "${TITLE}" \
              --notes "${NOTES_HEADER}" \
              --generate-notes \
              "${MODE_FLAGS[@]}"
          else
            gh release create "${TAG}" release-assets/* \
              --verify-tag \
              --title "${TITLE}" \
              --notes "${NOTES_HEADER}" \
              --generate-notes \
              "${MODE_FLAGS[@]}"
          fi
